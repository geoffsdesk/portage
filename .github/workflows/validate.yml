name: validate

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Portage package and dev dependencies
        run: |
          pip install -e . pytest gitleaks yamllint python-frontmatter pyyaml pydantic

      - name: Run Portage Structure & LFF Validator
        run: portage-validate --repo-root .

      - name: Run Unit & Smoke Tests
        run: pytest tools/egress-estimator/

      - name: Validate manifest.json & internal links
        run: portage-validate --check-manifest --check-links

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

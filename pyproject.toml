[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portage-skills"
version = "1.0.0rc1"
description = "Agent-driven EKS to GKE migration tools and skills validator."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
    "python-frontmatter>=1.0.0"
]

[project.scripts]
portage-egress-estimator = "portage.estimator:main"
portage-validate = "portage.validator:main"
